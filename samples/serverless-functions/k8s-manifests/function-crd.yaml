apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serverlessfunctions.serverless.eks.io
spec:
  group: serverless.eks.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - image
              properties:
                name:
                  type: string
                  description: Function name
                image:
                  type: string
                  description: Container image for the function
                port:
                  type: integer
                  default: 8080
                  description: Port the function listens on
                replicas:
                  type: object
                  properties:
                    min:
                      type: integer
                      default: 1
                    max:
                      type: integer
                      default: 10
                  description: Auto-scaling configuration
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          default: "100m"
                        memory:
                          type: string
                          default: "128Mi"
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                          default: "500m"
                        memory:
                          type: string
                          default: "512Mi"
                env:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                  description: Environment variables
            status:
              type: object
              properties:
                state:
                  type: string
                endpoint:
                  type: string
                replicas:
                  type: integer
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
        - name: State
          type: string
          jsonPath: .status.state
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
  scope: Namespaced
  names:
    plural: serverlessfunctions
    singular: serverlessfunction
    kind: ServerlessFunction
    shortNames:
      - sfn
      - sfunc
